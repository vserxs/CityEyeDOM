<body>

    <nav class="navbar">

                <ul class="nav-links">

                <br>

                <input type="submit" value="Enter">

                <p>
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </p>

            </div>

        </form>

    </main>


    
<footer>
    <div class="cityeye-clock">
        <span class="clock-label">Current Date and Time</span>
